name: Psalm (Laravel 13.31 pinned)

on:
  push:
    paths:
      - '**.php'
      - 'psalm.xml.dist'

jobs:
  psalm:
    name: Psalm analysis / Laravel 13.31 + Testbench 11.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: none

      - name: Install Laravel 13.31 and Testbench 11.2 dependencies
        run: |
          composer require --dev laravel/framework:13.31.0 orchestra/testbench:11.2.0 --no-update
          composer update --prefer-dist --prefer-stable --no-interaction

      - name: Run Psalm (informational, Laravel 13.31 compatibility snapshot)
        continue-on-error: true
        run: ./vendor/bin/psalm --php-version=8.4 --no-cache --threads=1 --output-format=github
