name: Tests

on: [push, pull_request]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            laravel: '^10.0'
            testbench: '^8.0'
            audit: informational
          - php: '8.4'
            laravel: '^11.0'
            testbench: '^9.0'
            audit: informational
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            audit: blocking
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            audit: blocking

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, mbstring, pdo_sqlite
          coverage: none
      - name: Install dependencies (advisory-affected compatibility lane)
        if: matrix.audit == 'informational'
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --prefer-stable --no-interaction --no-blocking
      - name: Install dependencies
        if: matrix.audit == 'blocking'
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --prefer-stable --no-interaction
      - name: Audit dependencies (informational)
        if: matrix.audit == 'informational'
        continue-on-error: true
        run: composer audit --locked --format=plain
      - name: Audit dependencies
        if: matrix.audit == 'blocking'
        run: composer audit --locked --format=plain
      - run: vendor/bin/phpunit --colors=always
